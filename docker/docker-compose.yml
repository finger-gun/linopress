version: "3.9"

services:
  wordpress:
    image: wordpress:php8.2-fpm
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_HOME: ${WP_HOME:-http://localhost:${WP_STACK_PORT:-8080}}
      WP_SITEURL: ${WP_SITEURL:-http://localhost:${WP_STACK_PORT:-8080}}
    volumes:
      - wp_root:/var/www/html
      - wp_content:/var/www/html/wp-content
    depends_on:
      db:
        condition: service_started
    networks:
      - linopress

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WP_STACK_PORT:-8080}:80"
    volumes:
      - wp_root:/var/www/html:ro
      - wp_content:/var/www/html/wp-content:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress
    networks:
      - linopress

  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WP_DB_NAME:-wordpress}
      MYSQL_USER: ${WP_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - linopress

  agent-api:
    build:
      context: ..
      dockerfile: agent-api/Dockerfile
    environment:
      WP_CONTENT_PATH: /var/www/html/wp-content
      WP_HOME: ${WP_HOME:-http://localhost:${WP_STACK_PORT:-8080}}
      WP_SITEURL: ${WP_SITEURL:-http://localhost:${WP_STACK_PORT:-8080}}
    volumes:
      - wp_content:/var/www/html/wp-content
    depends_on:
      - wordpress
    networks:
      - linopress

  browser:
    image: browserless/chrome:1.61-chrome-stable
    profiles: ["browser"]
    ports:
      - "${BROWSER_PORT:-3000}:3000"
    networks:
      - linopress

volumes:
  wp_root:
  wp_content:
  db_data:

networks:
  linopress:
    name: linopress
