<svg width="920" height="160" viewBox="0 0 920 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Linopress logotype</title>
  <desc id="logoDesc">Linopress brand combining symbolic mark with wordmark.</desc>

  <!-- Symbol inspired by the original linopress-logo.png -->
  <g>
    <!-- Outer rounded square container -->
    <rect x="8" y="8" width="144" height="144" rx="36" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.3"/>
    
    <!-- Main L and P letterform paths -->
    <path d="M40 48 L40 112 L72 112" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M72 56 L96 56 Q120 56 120 80 Q120 104 96 104 L72 104" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Accent dots suggesting flow/connection -->
    <circle cx="40" cy="48" r="4.5" fill="#FFFFFF"/>
    <circle cx="72" cy="112" r="4.5" fill="#FFFFFF"/>
    <circle cx="120" cy="80" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark - clean sans-serif text -->
  <text x="200" y="108" fill="#FFFFFF" font-family="Outfit, -apple-system, BlinkMacSystemFont, sans-serif" font-size="90" font-weight="700" letter-spacing="-2">
    Linopress
  </text>
</svg>
